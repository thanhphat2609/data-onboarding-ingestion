[project]
name = "ingestion-control-plane"
version = "0.1.0"
description = "Shared library and Ingestion API of the self-service ingestion platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "psycopg[binary]==3.3.6",
  "pymssql==2.4.5",
  "pymysql==1.2.3",
  "pyyaml==6.0.3",
  "sqlglot==30.24.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0", "vulture==2.14", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Dead code finder: `vulture` in CI lists functions, classes and variables that nothing uses. Delete what it finds.
# These are used from outside what it reads (framework hooks, data-onboarding-orchestration, library overrides).
[tool.vulture]
paths = ["src"]
min_confidence = 60
ignore_decorators = ["@app.*"]  # FastAPI routes and exception handlers
ignore_names = [
  "create_app",  # uvicorn factory
  "landing_table_sql", "fetch_to_landing", "KafkaLanding", "start_offset", "end_offset",  # the DAG factory
  "indentless", "check_hostname", "verify_mode",  # overrides of PyYAML and ssl
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
