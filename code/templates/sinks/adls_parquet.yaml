kind: SinkTemplate
name: adls_parquet
version: 1
format: parquet
uri: "abfss://{{ container }}@{{ storage_account }}.dfs.core.windows.net/parquet/{{ path }}"
# Where the runner writes (ADR-0004); the publisher renames <staging>/ingest_date=<date> into the table path.
# Until the publisher exists the runner's `--target final` writes `uri` directly, replacing the partition (ADR-0019).
staging_uri: "abfss://{{ container }}@{{ storage_account }}.dfs.core.windows.net/_staging/{{ run_id }}"

params:
  storage_account:     { type: string, required: true, description: "ADLS Gen2 account with hierarchical namespace" }
  container:           { type: string, default: raw }
  path:                { type: string, required: true, description: "<system>/<schema>/<table>" }
  compression:         { type: enum, values: [snappy, zstd], default: snappy }
  target_file_size_mb: { type: int, default: 256, min: 16, max: 1024 }

partition_by: [ingest_date]
publish: rename_partition
