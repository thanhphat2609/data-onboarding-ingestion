# Sample databases for demos and spikes (non-prod only). They stand in for the company's real systems: the platform
# stack (../docker-compose.yml) doesn't start them, and pipelines/ has no connection to them until you create one in
# the Web UI. Demo, step by step: README.md.
#
# Start: docker compose -f infrastructure/non-prod/sample_database/docker-compose.yml up -d
# Secrets: .env next to this file (from .env.example, created by ../bootstrap.sh). The read-only logins are handed to
# the platform through ../sources.env, like the GitHub secrets of prod (ADR-0013).

name: ingestion-sample-database

x-mssql-image: &mssql-image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

services:
  # Test API source (ADR-0015): paged JSON orders behind a bearer token; see api-source/server.py.
  api-source:
    image: python:3.12.15-slim-bookworm
    command: ["python", "/app/server.py"]
    environment:
      API_TOKEN: ${SHOP_API_TOKEN:?run bootstrap.sh to add new secrets}
    volumes:
      - ./api-source:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=4)"]
      interval: 10s
      retries: 5
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped

  # Test source with a seeded sample database (crm).
  sqlserver:
    image: *mssql-image
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  sqlserver-seed:
    image: *mssql-image
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD}
      - -b
      - -i
      - /seed/seed.sql
      - -v
      - RO_PASSWORD=${CRM_SQLSERVER_RO_PASSWORD:?}
    volumes:
      - ./sqlserver:/seed:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  # Test source (Phase 2): database `sales`, read-only role svc_ingest_ro. Seeded on the first start of the volume.
  postgres-source:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${SALES_POSTGRES_ADMIN_PASSWORD:?run bootstrap.sh to add new secrets}
      POSTGRES_DB: sales
      RO_PASSWORD: ${SALES_POSTGRES_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./postgres-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sales"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  # Test source (Phase 2): database `shop`, read-only user svc_ingest_ro. Seeded on the first start of the volume.
  mysql-source:
    image: mysql:8.4.13
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SHOP_MYSQL_ROOT_PASSWORD:?run bootstrap.sh to add new secrets}
      MYSQL_DATABASE: shop
      RO_PASSWORD: ${SHOP_MYSQL_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      - mysql-source-data:/var/lib/mysql
      - ./mysql-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      retries: 15
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped
networks:
  # Shared with the platform stack (api, airflow, flink) so they reach the sources by name; created by bootstrap.sh.
  default:
    name: ingestion-sources
    external: true

volumes:
  sqlserver-data:
  postgres-source-data:
  mysql-source-data:
