<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="t d">
  <title id="t">data-onboarding-ingestion architecture</title>
  <desc id="d">Users create connections and jobs in the Web UI. The Ingestion API validates them against the templates and schemas, checks SQL and previews data from the sources, and opens a pull request on data-onboarding-orchestration. Airflow there submits each run to the Flink JobManager over REST. The PyFlink runner on the JobManager and the TaskManagers read bounded data from SQL Server, PostgreSQL and MySQL, or from a Redpanda topic for API sources, and write Parquet or Delta to ADLS Gen2.</desc>
