# Non-prod: every service in one Compose project (ADR-0009). Sized for a 4-core / 16 GB Codespace.
# Start: docker compose -f infrastructure/non-prod/docker-compose.yml up -d --build
# Secrets come from infrastructure/non-prod/.env (created by bootstrap.sh, never committed).
#
# Metadata DB (ADR-0011): Airflow uses the platform's shared PostgreSQL server, hosted by the
# data-onboarding-agent stack, over the Docker network `data-platform` (both stacks on one host, as on VM 1).
# Without that stack, COMPOSE_PROFILES=local-db in .env (bootstrap.sh's default) starts a local PostgreSQL instead.

name: ingestion-nonprod

x-mssql-image: &mssql-image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

services:
  ui:
    build:
      context: ../..
      dockerfile: infrastructure/docker/ui/Dockerfile
    image: ingestion-ui:dev
    ports:
      - "3000:80"
    environment:
      AIRFLOW_URL: ${AIRFLOW_URL:-}
      FLINK_URL: ${FLINK_URL:-}
      # nginx proxies /api to the api service; "mock" keeps the in-browser mock instead.
      API_MODE: ${API_MODE:-http}
    mem_limit: 64m
    restart: unless-stopped

  # Ingestion API (code/control-plane): reads and writes pipelines/, tests sources, triggers DAGs in Airflow.
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api/Dockerfile
    image: ingestion-api:dev
    ports:
      - "8000:8000"
    environment:
      AIRFLOW_API_URL: http://airflow:8080
      # Secrets referenced by connections as env://<VAR>. Add a line here for each new reference.
      CRM_SQLSERVER_RO_PASSWORD: ${CRM_SQLSERVER_RO_PASSWORD:?}
      SALES_POSTGRES_RO_PASSWORD: ${SALES_POSTGRES_RO_PASSWORD:?run bootstrap.sh to add new secrets}
      SHOP_MYSQL_RO_PASSWORD: ${SHOP_MYSQL_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      # The same files Airflow reads: a saved job becomes a DAG without a restart (ADR-0008).
      - ../../pipelines:/workspace/pipelines
      - ../../code/templates:/workspace/code/templates:ro
    mem_limit: 256m
    restart: unless-stopped

  # Standalone only (profile local-db): same databases and roles as the shared server.
  postgres:
    image: postgres:16.15-alpine
    profiles: [local-db]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap.sh to create .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  # All Airflow components in one process tree (api-server, scheduler, dag-processor, triggerer).
  # Lighter than one container per component; prod uses separate services (Phase 6).
  airflow:
    # apache/airflow plus confluent-kafka for the fetch task of API jobs (ADR-0015).
    build:
      context: ../..
      dockerfile: infrastructure/docker/airflow/Dockerfile
    image: ingestion-airflow:dev
    # Migrates the database, creates pools from connection files, then runs `airflow standalone`.
    command: ["bash", "/opt/airflow/start.sh"]
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # `postgres` = the shared server on data-platform, or the local-db container. METADATA_DB_HOST overrides it.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@${METADATA_DB_HOST:-postgres}:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      # Non-prod only: no login; Codespaces port forwarding is private to the user.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Pick up new DAG files and changed job YAML quickly (ADR-0008).
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "30"
      INGESTION_PROJECT_DIR: /opt/airflow/projects/ingestion
      INGESTION_RUN_DIR: /opt/ingestion/runs
      FLINK_REST_URL: http://flink-jobmanager:8081
      FLINK_SMOKE_JAR: /opt/flink-examples/streaming/WordCount.jar
      # API jobs (ADR-0015): the fetch task uses the control plane library and lands records on Redpanda.
      PYTHONPATH: /opt/ingestion/control-plane
      LANDING_BOOTSTRAP_SERVERS: redpanda:9092
      # Secrets of API connections (env://<VAR>): the fetch task calls the API, so they live here, not in Flink.
      SHOP_API_TOKEN: ${SHOP_API_TOKEN:?run bootstrap.sh to add new secrets}
    volumes:
      # One folder per repository on the shared Airflow (ADR-0008).
      - ../../code/airflow/dags:/opt/airflow/dags/ingestion:ro
      - ../../code/airflow/scripts:/opt/airflow/scripts:ro
      - ../../pipelines/jobs:/opt/airflow/projects/ingestion/jobs:ro
      - ../../pipelines/connections:/opt/airflow/projects/ingestion/connections:ro
      - ../../code/templates:/opt/airflow/projects/ingestion/templates:ro
      - ./airflow/start.sh:/opt/airflow/start.sh:ro
      - ../../code/control-plane/src:/opt/ingestion/control-plane:ro
      - ./data/runs:/opt/ingestion/runs
      - airflow-logs:/opt/airflow/logs
      # Flink example JARs for the Phase 1 smoke job (filled by the JobManager image).
      - flink-examples:/opt/flink-examples:ro
    networks: [default, platform]
    depends_on:
      # Only with the local-db profile; the shared server is another Compose project, so start.sh waits for it.
      postgres:
        condition: service_healthy
        required: false
      flink-jobmanager:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 2g
    restart: unless-stopped

  flink-jobmanager:
    build:
      context: ../..
      dockerfile: infrastructure/docker/flink/Dockerfile
      target: jobmanager
    image: ingestion-flink-jobmanager:dev
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        execution.runtime-mode: BATCH
        python.client.executable: /opt/pyflink/bin/python
        python.executable: /opt/pyflink/bin/python
      # Phase 2 spikes read source passwords here; the runner resolves env:// the same way (Phase 4).
      CRM_SQLSERVER_RO_PASSWORD: ${CRM_SQLSERVER_RO_PASSWORD:?}
      SALES_POSTGRES_RO_PASSWORD: ${SALES_POSTGRES_RO_PASSWORD:?run bootstrap.sh to add new secrets}
      SHOP_MYSQL_RO_PASSWORD: ${SHOP_MYSQL_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      # Resolved job specs written by Airflow (ADR-0007).
      - ./data/runs:/opt/ingestion/runs:ro
      # Docker fills the empty volume from the image on first start; Airflow reads it.
      - flink-examples:/opt/flink/examples
      # Phase 2 spike jobs and their local Parquet output (written by the TaskManager).
      - ../../code/spikes:/opt/spikes:ro
      - ./data/spike-out:/opt/ingestion/spike-out
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 15s
      retries: 10
      start_period: 20s
    # JVM 1 GB plus the Python client that builds job graphs.
    mem_limit: 1792m
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: ../..
      dockerfile: infrastructure/docker/flink/Dockerfile
      target: taskmanager
    image: ingestion-flink-taskmanager:dev
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
    volumes:
      - ./data/spike-out:/opt/ingestion/spike-out
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    mem_limit: 1792m
    restart: unless-stopped

  # Landing for API sources (ADR-0015): Kafka API on redpanda:9092, one single-partition topic per API job, kept for
  # 7 days (Redpanda's default retention). Flink reads a run's offset range as a bounded table.
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped

  # Test API source (ADR-0015): paged JSON orders behind a bearer token; see api-source/server.py.
  api-source:
    image: python:3.12.15-slim-bookworm
    command: ["python", "/app/server.py"]
    environment:
      API_TOKEN: ${SHOP_API_TOKEN:?run bootstrap.sh to add new secrets}
    volumes:
      - ./api-source:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=4)"]
      interval: 10s
      retries: 5
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped

  # Test source with a seeded sample database (crm).
  sqlserver:
    image: *mssql-image
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  sqlserver-seed:
    image: *mssql-image
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD}
      - -b
      - -i
      - /seed/seed.sql
      - -v
      - RO_PASSWORD=${CRM_SQLSERVER_RO_PASSWORD:?}
    volumes:
      - ./sqlserver:/seed:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  # Test source (Phase 2): database `sales`, read-only role svc_ingest_ro. Seeded on the first start of the volume.
  postgres-source:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${SALES_POSTGRES_ADMIN_PASSWORD:?run bootstrap.sh to add new secrets}
      POSTGRES_DB: sales
      RO_PASSWORD: ${SALES_POSTGRES_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./postgres-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sales"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  # Test source (Phase 2): database `shop`, read-only user svc_ingest_ro. Seeded on the first start of the volume.
  mysql-source:
    image: mysql:8.4.13
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SHOP_MYSQL_ROOT_PASSWORD:?run bootstrap.sh to add new secrets}
      MYSQL_DATABASE: shop
      RO_PASSWORD: ${SHOP_MYSQL_RO_PASSWORD:?run bootstrap.sh to add new secrets}
    volumes:
      - mysql-source-data:/var/lib/mysql
      - ./mysql-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      retries: 15
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped

networks:
  default: {}
  # Created by the data-onboarding-agent stack (or by bootstrap.sh when running standalone).
  platform:
    name: data-platform
    external: true

volumes:
  postgres-data:   # local-db profile only
  airflow-logs:
  sqlserver-data:
  postgres-source-data:
  mysql-source-data:
  redpanda-data:
  # Filled from the JobManager image on first start; Airflow reads the smoke-job JAR from it.
  flink-examples:
