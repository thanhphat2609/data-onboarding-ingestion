# Example source: PostgreSQL, database sales, read-only role svc_ingest_ro (seeded on the first start of the volume) (non-prod only; it plays one of the company's systems). Demo: ../README.md.
# Start alone:   docker compose -f infrastructure/non-prod/example-sources/postgresql/docker-compose.yml up -d
# Start all:     docker compose -f infrastructure/non-prod/example-sources/docker-compose.yml up -d
# Secrets: .env next to this file (from .env.example, created by ../../bootstrap.sh). The read-only login is handed to
# the platform through ../../sources.env, like a GitHub secret in prod (ADR-0013).

# Same project name in every source file, so a source started alone and "start all" are the same containers.
name: ingestion-example-sources

services:
  postgres-source:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${SALES_POSTGRES_ADMIN_PASSWORD:?run bootstrap.sh to create .env}
      POSTGRES_DB: sales
      RO_PASSWORD: ${SALES_POSTGRES_RO_PASSWORD:?run bootstrap.sh to create .env}
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./01-sales.sh:/docker-entrypoint-initdb.d/01-sales.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sales"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

networks:
  # Shared with the platform stack (api, airflow, flink), which reaches the source by its service name; created by
  # ../../bootstrap.sh.
  default:
    name: ingestion-sources
    external: true

volumes:
  postgres-source-data:
