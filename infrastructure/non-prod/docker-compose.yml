# Non-prod: Web UI, API, Flink and Redpanda in one Compose project (ADR-0009). Sized for a 4-core / 16 GB Codespace.
# Start: docker compose -f infrastructure/non-prod/docker-compose.yml up -d --build
# Secrets come from infrastructure/non-prod/.env (created by bootstrap.sh, never committed). Source secrets that
# connections reference as env://<VAR> come from sources.env, like prod's (ADR-0013).
#
# The test sources (SQL Server, PostgreSQL, MySQL, a REST API) are a separate project, started by hand for a demo:
# example-sources/ (README.md there). Like the company's real systems, they are not part of the platform.
#
# Airflow is in data-onboarding-orchestration (ADR-0016): its stack starts after this one, mounts this checkout
# read-only and reaches Flink, Redpanda and the API over the Docker network `data-platform`.

name: ingestion-nonprod

services:
  ui:
    build:
      context: ../..
      dockerfile: infrastructure/docker/ui/Dockerfile
    image: ingestion-ui:dev
    ports:
      - "3000:80"
    environment:
      AIRFLOW_URL: ${AIRFLOW_URL:-}
      FLINK_URL: ${FLINK_URL:-}
      # nginx proxies /api to the api service; "mock" keeps the in-browser mock instead.
      API_MODE: ${API_MODE:-http}
    mem_limit: 64m
    restart: unless-stopped

  # Ingestion API (code/control-plane): reads and writes pipelines/, tests sources, triggers DAGs in Airflow.
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api/Dockerfile
    image: ingestion-api:dev
    ports:
      - "8000:8000"
    environment:
      AIRFLOW_API_URL: http://airflow:8080
    # Values of env://<VAR> references, for "Test connection" and the preview (prod: vm1/sources.env).
    env_file:
      - path: sources.env
        required: false
    volumes:
      # The same files Airflow mounts from this checkout: a saved job becomes a DAG without a restart (ADR-0008).
      - ../../pipelines:/workspace/pipelines
      - ../../code/templates:/workspace/code/templates:ro
    networks: [default, platform, sources]
    mem_limit: 256m
    restart: unless-stopped

  flink-jobmanager:
    build:
      context: ../..
      dockerfile: infrastructure/docker/flink/Dockerfile
      target: jobmanager
    image: ingestion-flink-jobmanager:dev
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        execution.runtime-mode: BATCH
        python.client.executable: /opt/pyflink/bin/python
        python.executable: /opt/pyflink/bin/python
    # Phase 2 spikes read source passwords here; the runner resolves env:// the same way (Phase 4).
    env_file:
      - path: sources.env
        required: false
    volumes:
      # Resolved job specs written by Airflow, which mounts this directory too (ADR-0007, ADR-0016).
      - ./data/runs:/opt/ingestion/runs:ro
      # Docker fills the empty volume from the image on first start; Airflow reads it.
      - flink-examples:/opt/flink/examples
      # Phase 2 spike jobs and their local Parquet output (written by the TaskManager).
      - ../../code/spikes:/opt/spikes:ro
      - ./data/spike-out:/opt/ingestion/spike-out
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 15s
      retries: 10
      start_period: 20s
    networks: [default, platform, sources]
    # JVM 1 GB plus the Python client that builds job graphs.
    mem_limit: 1792m
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: ../..
      dockerfile: infrastructure/docker/flink/Dockerfile
      target: taskmanager
    image: ingestion-flink-taskmanager:dev
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
    volumes:
      - ./data/spike-out:/opt/ingestion/spike-out
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks: [default, sources]
    mem_limit: 1792m
    restart: unless-stopped

  # Landing for API sources (ADR-0015): Kafka API on redpanda:9092, one single-partition topic per API job, kept for
  # 7 days (Redpanda's default retention). Flink reads a run's offset range as a bounded table.
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      retries: 10
      start_period: 20s
    networks: [default, platform]
    mem_limit: 768m
    restart: unless-stopped

networks:
  default: {}
  # Created by the data-onboarding-agent stack (or by a bootstrap.sh). Airflow reaches Flink, Redpanda and the API here.
  platform:
    name: data-platform
    external: true
  # Shared with example-sources/ (the test sources), so connections reach them by name; created by bootstrap.sh.
  sources:
    name: ingestion-sources
    external: true

volumes:
  redpanda-data:
  # Filled from the JobManager image on first start; Airflow mounts it by this name for the smoke-job JAR.
  flink-examples:
    name: ingestion-flink-examples
