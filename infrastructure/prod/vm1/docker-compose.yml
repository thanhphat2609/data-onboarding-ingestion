# Prod VM 1 (ADR-0007, ADR-0009): Web UI, Ingestion API, Flink JobManager, Redpanda.
# Airflow is in data-onboarding-orchestration on this VM (ADR-0016): it mounts this checkout read-only and reaches these
# services over the Docker network `data-platform`, created by the data-onboarding-agent stack (ADR-0011).
# Deployed by infrastructure/prod/deploy.sh (ADR-0012). DRAFT until the prod VMs exist (roadmap Phase 6).
# Secrets: .env next to this file (from .env.example) and sources.env for env:// references, both only on the VM.

name: ingestion-prod

services:
  ui:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/ui/Dockerfile
    image: ingestion-ui:prod
    ports:
      - "${UI_PORT:-80}:80"
    environment:
      AIRFLOW_URL: ${AIRFLOW_PUBLIC_URL:-}
      FLINK_URL: ${FLINK_PUBLIC_URL:-}
      API_MODE: http
    mem_limit: 64m
    restart: unless-stopped

  # The API (uid 1000) must be able to write its working copy. A named volume keeps the owner it was created with
  # (root, when the image had no such directory), so fix it on every start; the API refuses to start otherwise.
  api-pipelines-init:
    image: ingestion-api:prod
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /workspace/pipelines/connections /workspace/pipelines/jobs && chown -R 1000:1000 /workspace/pipelines"]
    volumes:
      - api-pipelines:/workspace/pipelines
    restart: "no"

  api:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/api/Dockerfile
    image: ingestion-api:prod
    environment:
      # Every save opens a pull request on the orchestration repository (ADR-0017).
      SAVE_MODE: pull_request
      GITHUB_TOKEN: ${ORCHESTRATION_GITHUB_TOKEN:?}
      ORCHESTRATION_REPOSITORY: ${ORCHESTRATION_REPOSITORY:-thanhphat2609/data-onboarding-orchestration}
      ORCHESTRATION_BASE_BRANCH: ${ORCHESTRATION_BASE_BRANCH:-main}
      # What is merged there is listed and read from this checkout; a save leaves nothing in the working copy.
      INGESTION_REFERENCE_PIPELINES_DIR: /workspace/orchestration-pipelines
    env_file:
      - path: sources.env
        required: false
    volumes:
      # Working copy of a save in progress (emptied once its pull request is open); the files Airflow runs, and what the
      # API lists, are in the data-onboarding-orchestration checkout next to this repository.
      - api-pipelines:/workspace/pipelines
      - ${ORCHESTRATION_REPO_DIR:-../../../../data-onboarding-orchestration}/pipelines:/workspace/orchestration-pipelines:ro
      - ../../../code/templates:/workspace/code/templates:ro
    depends_on:
      api-pipelines-init:
        condition: service_completed_successfully
    networks: [default, platform]
    mem_limit: 512m
    restart: unless-stopped

  # Landing for API sources (ADR-0015). Kafka API on redpanda:9092; the TaskManagers on VM 2 read it through the
  # published port at FLINK_JOBMANAGER_ADDRESS:19092 (VM 1's private address). Sizing is open (roadmap question 8).
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=${REDPANDA_MEMORY:-1G}
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${FLINK_JOBMANAGER_ADDRESS:?private address of VM 1}:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API, from the TaskManagers on VM 2
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 15s
      retries: 10
      start_period: 30s
    networks: [default, platform]
    restart: unless-stopped

  # Airflow submits the runner through the JobManager's REST API, which only runs jars it was handed: put the
  # flink-python jar (PythonDriver) where Airflow can upload it from, on every deploy (the volume is filled once).
  flink-python-jar-init:
    image: ingestion-flink-jobmanager:prod
    user: root
    entrypoint: ["sh", "-c", "cp -f /opt/flink/lib/flink-python-*.jar /opt/flink/examples/flink-python.jar"]
    volumes:
      - flink-examples:/opt/flink/examples
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: "no"

  flink-jobmanager:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/flink/Dockerfile
      target: jobmanager
    image: ingestion-flink-jobmanager:prod
    command: jobmanager
    ports:
      - "8081:8081"   # REST and web UI
      - "6123:6123"   # RPC, from the TaskManagers on VM 2
      - "6124:6124"   # blob server, from the TaskManagers on VM 2
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: ${FLINK_JOBMANAGER_ADDRESS:?private address of VM 1}
        jobmanager.bind-host: 0.0.0.0
        jobmanager.rpc.port: 6123
        blob.server.port: 6124
        rest.bind-address: 0.0.0.0
        jobmanager.memory.process.size: ${JOBMANAGER_MEMORY:-2048m}
        execution.runtime-mode: BATCH
        python.client.executable: /opt/pyflink/bin/python
        python.executable: /opt/pyflink/bin/python
        # ADLS Gen2 account key for abfss:// (the sink's storage_account must be this account).
        fs.azure.account.key.${ADLS_STORAGE_ACCOUNT:?}.dfs.core.windows.net: ${ADLS_ACCOUNT_KEY:?}
    env_file:
      - path: sources.env
        required: false
    volumes:
      - runs:/opt/ingestion/runs:ro
      - flink-examples:/opt/flink/examples
      # The runner (ADR-0010) reads the merged job and connection files of the orchestration checkout, and the templates.
      - ../../../code/runner:/opt/runner:ro
      - ../../../code/templates:/opt/ingestion/templates:ro
      - ${ORCHESTRATION_REPO_DIR:-../../../../data-onboarding-orchestration}/pipelines:/opt/ingestion/pipelines:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 15s
      retries: 10
      start_period: 20s
    networks: [default, platform]
    restart: unless-stopped

networks:
  default: {}
  # Created by the data-onboarding-agent stack (ADR-0011). Airflow reaches Flink, Redpanda and the API here.
  platform:
    name: data-platform
    external: true

volumes:
  redpanda-data:
  api-pipelines:
  # Airflow mounts these two by name.
  runs:
    name: ingestion-runs
  flink-examples:
    name: ingestion-flink-examples
