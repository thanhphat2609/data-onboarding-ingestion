# Stage 1 of CI/CD (ADR-0012): checks on every pull request and every push to main. Nothing is deployed here;
# a green run on main is what the Deploy workflow (stage 2) waits for.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, YAML files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/control-plane/pyproject.toml
      - name: Install the control plane
        run: pip install "./code/control-plane[dev]"
      - name: Ruff
        run: |
          ruff check --no-cache code/control-plane/src code/control-plane/tests code/spikes
          ruff format --no-cache --check code/control-plane/src code/control-plane/tests code/spikes
      - name: Mypy
        working-directory: code/control-plane
        run: mypy --no-incremental src
      - name: Pytest (offline, fake API and in-memory landing)
        working-directory: code/control-plane
        run: pytest -q
      - name: Airflow files compile
        run: python -m py_compile code/airflow/dags/*.py code/airflow/scripts/*.py
      - name: Validate pipelines/ (connections and jobs)
        # The paths are needed: the installed package can't find the checkout by itself.
        env:
          INGESTION_PIPELINES_DIR: pipelines
          INGESTION_TEMPLATES_DIR: code/templates
        run: |
          python -m ingestion.validate
          # The demo's example files (infrastructure/non-prod/sample_database/examples/) stay valid too.
          INGESTION_PIPELINES_DIR=infrastructure/non-prod/sample_database/examples python -m ingestion.validate

  ui:
    name: Web UI (types, lint, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker:
    name: Compose files and image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Dummy .env files
        run: |
          for example in $(git ls-files '*.env.example'); do
            sed 's/__GENERATE__/ci-dummy-Aa1/' "$example" > "${example%.example}"
          done
      - name: Compose files are valid
        run: |
          for file in $(git ls-files '*docker-compose.yml'); do
            echo "::group::$file"
            docker compose --env-file "$(dirname "$file")/.env" -f "$file" config --quiet
            echo "::endgroup::"
          done
      - name: Build every image (not pushed)
        run: docker compose -f infrastructure/non-prod/docker-compose.yml build
