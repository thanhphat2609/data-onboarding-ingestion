[project]
name = "ingestion-runner"
version = "0.1.0"
description = "Generic PyFlink ingestion runner (ADR-0010); runs on the Flink JobManager"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0", "vulture==2.14", "types-PyYAML"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Dead code finder: `vulture` in CI lists functions, classes and variables that nothing uses. Delete what it finds.
[tool.vulture]
paths = ["ingestion_runner", "main.py"]
min_confidence = 60

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
