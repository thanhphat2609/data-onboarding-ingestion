# Demo sources for the prototype prod VM 1: MySQL (database shop), PostgreSQL (database sales) and SQL Server
# (database crm), seeded by the example sources of non-prod (same data, same read-only login svc_ingest_ro). They
# play the company's systems, so they are not part of the platform stack and no deploy starts them. On VM 1, from
# the repository checkout:
#   docker compose -f infrastructure/prod/demo-sources.yml up -d --wait
# The hosts are the service names on the Docker network data-platform, which Airflow, Flink's JobManager and the API
# share. The TaskManagers on VM 2 read the sources themselves: VM 1 publishes 3306, 5432 and 1433 (allow VM 2's
# address in the firewall) and VM 2 resolves the three names to VM 1 (extra_hosts in vm2/docker-compose.yml).
# Prototype password for every login: DataOnboarding2026, override with DEMO_SOURCES_PASSWORD. The read-only one must
# equal the GitHub secrets SHOP_MYSQL_RO_PASSWORD, SALES_POSTGRES_RO_PASSWORD and CRM_SQLSERVER_RO_PASSWORD. A demo
# default, not for real systems: in prod proper the connections point at the real systems.

name: demo-sources

services:
  mysql-source:
    image: mysql:8.4.13
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
      MYSQL_DATABASE: shop
      RO_PASSWORD: ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
    volumes:
      - mysql-source-data:/var/lib/mysql
      - ../non-prod/example-sources/mysql/01-shop.sh:/docker-entrypoint-initdb.d/01-shop.sh:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      retries: 15
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped
    networks: [platform]

  postgres-source:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
      POSTGRES_DB: sales
      RO_PASSWORD: ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ../non-prod/example-sources/postgresql/01-sales.sh:/docker-entrypoint-initdb.d/01-sales.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sales"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    networks: [platform]

  sqlserver-source:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver-source-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped
    networks: [platform]

  # Runs once per deploy: creates the crm database, its tables and the read-only login svc_ingest_ro (password:
  # CRM_SQLSERVER_RO_PASSWORD, the same secret pipelines/connections/crm-sqlserver-nonprod.yaml reads), then exits.
  sqlserver-source-seed:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - sqlserver-source
      - -U
      - sa
      - -P
      - ${DEMO_SOURCES_PASSWORD:-DataOnboarding2026}
      - -b
      - -i
      - /seed/seed.sql
      - -v
      - RO_PASSWORD=${CRM_SQLSERVER_RO_PASSWORD:?run bootstrap.sh to create .env}
    volumes:
      - ../non-prod/example-sources/sqlserver/seed.sql:/seed/seed.sql:ro
    depends_on:
      sqlserver-source:
        condition: service_healthy
    networks: [platform]
    restart: "no"

networks:
  platform:
    name: data-platform
    external: true

volumes:
  mysql-source-data:
  postgres-source-data:
  sqlserver-source-data:
