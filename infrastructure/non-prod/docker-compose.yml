# Non-prod: every service in one Compose project (ADR-0009). Sized for a 4-core / 16 GB Codespace.
# Start: docker compose -f infrastructure/non-prod/docker-compose.yml up -d --build
# Secrets come from infrastructure/non-prod/.env (created by bootstrap.sh, never committed).
#
# Metadata DB (ADR-0011): Airflow uses the platform's shared PostgreSQL server, hosted by the
# data-onboarding-agent stack, over the Docker network `data-platform` (both stacks on one host, as on VM 1).
# Without that stack, COMPOSE_PROFILES=local-db in .env (bootstrap.sh's default) starts a local PostgreSQL instead.

name: ingestion-nonprod

x-airflow-image: &airflow-image apache/airflow:3.3.2
x-flink-image: &flink-image flink:1.20.5-scala_2.12-java17
x-mssql-image: &mssql-image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

services:
  ui:
    build:
      context: ../..
      dockerfile: infrastructure/docker/ui/Dockerfile
    image: ingestion-ui:dev
    ports:
      - "3000:80"
    environment:
      AIRFLOW_URL: ${AIRFLOW_URL:-}
      FLINK_URL: ${FLINK_URL:-}
    mem_limit: 64m
    restart: unless-stopped

  # Standalone only (profile local-db): same databases and roles as the shared server.
  postgres:
    image: postgres:16.15-alpine
    profiles: [local-db]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap.sh to create .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  # All Airflow components in one process tree (api-server, scheduler, dag-processor, triggerer).
  # Lighter than one container per component; prod uses separate services (Phase 6).
  airflow:
    image: *airflow-image
    # Migrates the database, creates pools from connection files, then runs `airflow standalone`.
    command: ["bash", "/opt/airflow/start.sh"]
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # `postgres` = the shared server on data-platform, or the local-db container. METADATA_DB_HOST overrides it.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@${METADATA_DB_HOST:-postgres}:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      # Non-prod only: no login; Codespaces port forwarding is private to the user.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Pick up new DAG files and changed job YAML quickly (ADR-0008).
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "30"
      INGESTION_PROJECT_DIR: /opt/airflow/projects/ingestion
      INGESTION_RUN_DIR: /opt/ingestion/runs
      FLINK_REST_URL: http://flink-jobmanager:8081
      FLINK_SMOKE_JAR: /opt/flink-examples/streaming/WordCount.jar
    volumes:
      # One folder per repository on the shared Airflow (ADR-0008).
      - ../../code/airflow/dags:/opt/airflow/dags/ingestion:ro
      - ../../code/airflow/scripts:/opt/airflow/scripts:ro
      - ../../pipelines/jobs:/opt/airflow/projects/ingestion/jobs:ro
      - ../../pipelines/connections:/opt/airflow/projects/ingestion/connections:ro
      - ../../code/templates:/opt/airflow/projects/ingestion/templates:ro
      - ./airflow/start.sh:/opt/airflow/start.sh:ro
      - ./data/runs:/opt/ingestion/runs
      - airflow-logs:/opt/airflow/logs
      # Flink example JARs for the Phase 1 smoke job (filled by the JobManager image).
      - flink-examples:/opt/flink-examples:ro
    networks: [default, platform]
    depends_on:
      # Only with the local-db profile; the shared server is another Compose project, so start.sh waits for it.
      postgres:
        condition: service_healthy
        required: false
      flink-jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 2g
    restart: unless-stopped

  flink-jobmanager:
    image: *flink-image
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        execution.runtime-mode: BATCH
    volumes:
      # Resolved job specs written by Airflow (ADR-0007).
      - ./data/runs:/opt/ingestion/runs:ro
      # Docker fills the empty volume from the image on first start; Airflow reads it.
      - flink-examples:/opt/flink/examples
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 15s
      retries: 10
      start_period: 20s
    mem_limit: 1280m
    restart: unless-stopped

  flink-taskmanager:
    image: *flink-image
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    mem_limit: 1792m
    restart: unless-stopped

  # Test source with a seeded sample database (crm).
  sqlserver:
    image: *mssql-image
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  sqlserver-seed:
    image: *mssql-image
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD}
      - -b
      - -i
      - /seed/seed.sql
      - -v
      - RO_PASSWORD=${CRM_SQLSERVER_RO_PASSWORD:?}
    volumes:
      - ./sqlserver:/seed:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

networks:
  default: {}
  # Created by the data-onboarding-agent stack (or by bootstrap.sh when running standalone).
  platform:
    name: data-platform
    external: true

volumes:
  postgres-data:   # local-db profile only
  airflow-logs:
  sqlserver-data:
