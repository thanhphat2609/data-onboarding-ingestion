server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ingestion API on the same origin: no CORS, and it works behind Codespaces port forwarding.
    # The variable makes nginx resolve "api" per request, so the UI starts even when the API is down.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # preview queries time out after 60 s in the API
    }

    # Runtime config and the app shell must always be fresh.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths serve the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
